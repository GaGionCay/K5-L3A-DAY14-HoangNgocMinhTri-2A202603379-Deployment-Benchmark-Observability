services:
  agent:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8000
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
